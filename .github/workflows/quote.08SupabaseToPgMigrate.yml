# Supabase 存量行情迁移到自建行情服务(PG): 分批搬库 + 同步成功即删除源表数据
# 读取 Supabase 表 finv_quote_secu_kline_min 的存量行, 按「各证券最早数据的 ts」
# 升序逐个证券迁移, 证券内按 ts 升序分批(每批默认 100 行, 单批只含一个证券),
# 通过 POST {URL_QUOTE_SYNC_BASE}/API/V1/Meta/Finv/Quote/Secu/KLine/Min/Upsert
# 写入自建行情服务, 整批写入成功后再从 Supabase 删除这批已同步的行
# (接口文档见 .github/Python/ApiUpsertBatchDelete.md)。
# 脚本: .github/Python/Quote/Task17SupabaseToPgMigrate.py
#
# 触发方式:
#   - 定时触发: 每天自动运行一次(北京时间 02:30 = UTC 18:30), 输入取默认值:
#     batchSize=100 / maxBatches=50000; 删除开关由仓库变量
#     MIGRATE_SCHEDULED_DELETE 控制(未配置 = 按脚本默认开删除;
#     配为 "false" = 定时运行只迁移不删除)
#   - 手动触发: Actions 页 Run workflow, 各输入以页面填写为准
#     (enableDelete 仅作用于本次运行)
#
# 检出分支: 固定检出 quote 分支(见 checkout 步骤的 ref) —— 本任务要求迁移脚本
# 与数据链路都在 quote 分支上执行; 因此本工作流文件与 Task17SupabaseToPgMigrate.py
# 必须已合入 quote 分支, 否则该分支上找不到脚本。
#
# 输入项:
#   batchSize       单批行数(默认 100; 单批只含一个证券, 上限 5000)
#   maxBatches      单次运行的批次上限(默认 50000; 达到即停, 重跑可继续)
#   enableDelete    是否在写入成功后删除 Supabase 中的已同步行(默认 true)
#                   —— 想先演练核对日志时设为 false(只迁移不删除)
#   continueOnError 单批失败后是否继续往后处理(默认 false: 立即停止)
#
# 注意:
#   - 依赖 Secrets: SUPABASE_PROJECT_REF / SUPABASE_KEY(读源表、删源表数据),
#     URL_QUOTE_SYNC_BASE(自建行情服务地址, 无鉴权, 服务端按来源 IP 白名单放行);
#   - 删除不可恢复: 建议首次用 batchSize=100 / maxBatches=1 / enableDelete=false
#     跑一轮, 核对「读取/写入/跳过」数字后再正式开删;
#   - 单批写入失败时该批一行都不会被删除, 修复后重跑即可(Upsert 幂等, 不会重复
#     也不会丢数据); 有行级校验失败的行会保留在源表并在日志中逐条给出原因;
#   - 并发保护: 同一时刻只允许一个迁移任务运行(concurrency, 手动与定时共用),
#     避免两个任务互相重复搬运 / 竞态删除; 定时与手动撞车时后者排队等待;
#   - 达到批次上限属正常收工(退出码 0), 再触发一次即可继续迁移剩余数据。
name: quote.08SupabaseToPgMigrate

on:
  schedule:
    # 每天一次: 北京时间 02:30 = UTC 18:30
    # (GitHub 定时任务按 UTC 解析, 实际触发可能有数分钟级延迟)
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      batchSize:
        description: "单批行数(单批只含一个证券, 上限 5000)"
        required: false
        default: "100"
      maxBatches:
        description: "单次运行的批次上限"
        required: false
        default: "50000"
      enableDelete:
        description: "写入成功后删除 Supabase 中的已同步行"
        type: boolean
        required: false
        default: true
      continueOnError:
        description: "单批失败后继续往后处理"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: quote-supabase-to-pg-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # 50000 批 × 100 行的大迁移耗时较长, 给足 5h50m(GitHub 上限 6h)
    timeout-minutes: 350

    steps:
      - name: CheckoutRepository
        uses: actions/checkout@v5
        with:
          # 按需求固定检出 quote 分支, 不随触发分支/默认分支变化
          ref: quote
          fetch-depth: 1

      - name: SetupPython
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: RunSupabaseMigrate
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          URL_QUOTE_SYNC_BASE: ${{ secrets.URL_QUOTE_SYNC_BASE }}
          MIGRATE_BATCH_SIZE: ${{ inputs.batchSize || '100' }}
          MIGRATE_MAX_BATCHES: ${{ inputs.maxBatches || '50000' }}
          # 布尔输入在表达式里转成字符串(与脚本 env_bool 约定一致)。
          # 手动触发取输入值; 定时触发(无 inputs)回落到仓库变量 MIGRATE_SCHEDULED_DELETE,
          # 未配置时为空 -> 脚本默认开删除(本任务的本职行为)
          MIGRATE_ENABLE_DELETE: ${{ github.event_name == 'workflow_dispatch' && (inputs.enableDelete && 'true' || 'false') || vars.MIGRATE_SCHEDULED_DELETE }}
          MIGRATE_CONTINUE_ON_ERROR: ${{ inputs.continueOnError && 'true' || 'false' }}
          MIGRATE_ON_CONFLICT: update
          MIGRATE_TIMEOUT: "60"
          MIGRATE_SUPABASE_TIMEOUT: "60"
          MIGRATE_RETRIES: "2"
          # 未配置仓库变量 = 严格模式: 有行被跳过 / 删除数不符都按失败返回
          MIGRATE_ALLOW_SKIPPED_ROWS: ${{ vars.MIGRATE_ALLOW_SKIPPED_ROWS }}
          MIGRATE_ALLOW_DELETE_MISMATCH: ${{ vars.MIGRATE_ALLOW_DELETE_MISMATCH }}
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          # -u: 不缓冲 stdout, 让进度/错误在 Actions 日志里实时可见
          python3 -u .github/Python/Quote/Task17SupabaseToPgMigrate.py
