# quote-gold.PublishToArchive —— QuoteGold 归档 .mvsv 跨仓库转存
# =============================================================================
#
# 每日把本仓库(ACANX/Distribution) quote-gold 分支
# Archive/Finv/QuoteGold/Day/CN_CNOTC/{Code}/ 下、文件名日期早于(北京时间)
# 今日-N 天(N 默认 4, 可在分支代码 .github/Python/QuoteGold/PublishToArchiveRepo.py
# 的 DEFAULT_DAYS 或本工作流 env QUOTE_GOLD_PUBLISH_DAYS 配置)的 .mvsv 归档文件,
# 经 GitHub Contents API 转存到另一个仓库 acdnx/Distribution 的 quote-gold 分支
# **同路径**下。
#
# 与 news.PublishNewsFlashJsonl 同一套跨仓库约定(重要):
#   * ACANX/Distribution 与 acdnx/Distribution 是两个真实存在的独立仓库, 不是
#     同一仓库的大小写变体。转存目标必须显式写死(脚本内置 + 本文件 env 注入),
#     绝不经 .git 解析 —— 否则会写回本仓库自身。
#   * GIT_COMMIT_TOKEN 需同时具备两个仓库的权限: 读本仓库(checkout 检出用),
#     写 acdnx/Distribution 的 quote-gold 分支(Contents API 提交用)。
#     本工作流只从本仓库读数据, 不写本仓库, 因此不与本仓库其它数据推送
#     产生 push 竞争。
#   * 脚本经 blob sha 幂等比对(与远端同路径文件的 sha 相同即跳过), 定期重跑
#     不会产生内容不变的空提交; 源文件不删除, 由源端归档窗口自然清退。
#
# 调度: 北京时间每日 05:20(UTC 21:20), 与 news.PublishNewsFlashJsonl 同时点,
# 错峰于本仓库其它 quote-gold 任务。
# 注意 schedule 只在默认分支 dev 上生效; actions/checkout 的 ref 指向脚本
# 实际所在的 quote-gold 分支。

name: quote-gold.PublishToArchive

on:
  schedule:
    - cron: "20 21 * * *"   # UTC 21:20 = 北京时间 05:20
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印将要转存的文件, 不实际提交"
        type: boolean
        default: false
      days:
        description: "转存缓冲天数(覆盖分支代码默认值 4), 只搬 文件名日期 <= 今日-该值"
        type: string
        default: ""
      code:
        description: "只转存指定品种目录(逗号分隔, 如 GAP-CMB,ACG-ICBC), 留空=全部"
        type: string
        default: ""
      date:
        description: "只转存该日期(YYYYMMDD)的文件(仍受缓冲天数约束), 留空=不限"
        type: string
        default: ""

permissions:
  contents: read   # 只读本仓库; 对 acdnx 的写入经 GIT_COMMIT_TOKEN 走 API

concurrency:
  group: QuoteGoldPublishToArchive
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout quote-gold (脚本与源数据所在分支)
        uses: actions/checkout@v4
        with:
          ref: quote-gold
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 脚本仅标准库; 保留依赖安装步骤与其它工作流对齐, 以备将来引入第三方库
      - name: Install dependencies
        run: |
          if compgen -G ".github/requirements*.txt" > /dev/null; then
            pip install -r .github/requirements*.txt
          else
            echo "无 requirements 文件, 跳过依赖安装(仅标准库)"
          fi

      - name: Publish archive files to acdnx/Distribution
        env:
          GIT_COMMIT_TOKEN: ${{ secrets.GIT_COMMIT_TOKEN }}
          # 转存端身份(须与脚本内置默认一致; 两个仓库是独立仓库, 不是大小写变体)
          QUOTE_GOLD_PUBLISH_TARGET_OWNER: acdnx
          QUOTE_GOLD_PUBLISH_TARGET_REPO: Distribution
          QUOTE_GOLD_PUBLISH_BRANCH: quote-gold
          # 转存缓冲天数: 脚本 DEFAULT_DAYS=4 的覆盖入口, 在此即可改天数
          # (workflow_dispatch 手动触发时可用输入覆盖此默认)
          QUOTE_GOLD_PUBLISH_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.days || '4' }}
          QUOTE_GOLD_PUBLISH_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.code || '' }}
          QUOTE_GOLD_PUBLISH_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.date || '' }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
            if [ -n "${{ inputs.days }}" ]; then
              ARGS="$ARGS --days ${{ inputs.days }}"
            fi
          fi
          python3 .github/Python/QuoteGold/PublishToArchiveRepo.py $ARGS
