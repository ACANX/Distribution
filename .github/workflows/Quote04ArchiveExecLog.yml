name: Quote04ArchiveExecLog
on:
  workflow_dispatch:
  schedule:
    - cron: "55 15 * * *"
concurrency:
  group: quote-all
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: quote
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r Python/Quote/requirements.txt
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Run Task04ArchiveSecuQuoteExecLogDaily
        run: python Python/Quote/Task04ArchiveSecuQuoteExecLogDaily.py
      - name: VerifyCleanPush
        run: |
          git log origin/quote..HEAD --oneline | (! read)
          git status --short | (! read)
