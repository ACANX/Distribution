name: AutoSquashMergeLatestBrenchCommitsExcludingAuthor

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch name'
        required: true
        default: 'latest'
      N:
        description: 'Number of recent commits to inspect'
        required: true
        default: '20'
      excluded_author:
        description: 'Author email to exclude (exact match)'
        required: true
      commit_message:
        description: 'Commit message for the squashed commit'
        required: true
        default: 'MergeRecentCommits'

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # 获取完整历史以支持变基

      - name: RunSquashScript
        run: |
          chmod +x ./Bash/AutoSquashMergeLatestBrenchCommitsExcludingAuthor.sh
          ./Bash/merge.sh "${{ github.event.inputs.branch }}" \
                           "${{ github.event.inputs.N }}" \
                           "${{ github.event.inputs.excluded_author }}" \
                           "${{ github.event.inputs.commit_message }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
