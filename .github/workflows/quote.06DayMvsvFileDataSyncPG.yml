# 行情文件增量入库 Supabase PG + 验证后删除源文件:
# 读取 quote 分支 Archive/Finv/SecuQuote/Day/ 与 Archive/Finv/SecuQuote/FTMM/V5/
# 下的 .mvsv 行情文件, 解析后按批次(默认 50 行/批, 可配置)以 PostgREST
# Upsert(on_conflict=ts,usc) 字段级增量更新到 Supabase 表 finv_quote_secu_kline_min;
# 单个文件全部批次成功且删除开关(enableDelete)开启时, 才通过 Contents API 删除
# quote 分支上对应的源文件; 任一批次失败则保留源文件(单批失败不阻塞后续批与后续
# 文件, upsert 幂等可重跑)。
#   - Task06DayMvsvFileDataSyncSupabase: Day/ (SecuQuote 11 列格式)
#   - Task16DayMvsvFileDataSyncPG: FTMM/V5/ 的同一批数据先增量镜像到自建行情服务
#     (POST {URL_QUOTE_SYNC_BASE}/API/V1/Meta/Finv/Quote/Secu/KLine/Min/Upsert,
#      接口文档见 .github/Python/ApiUpsertBatchDelete.md); 该步骤只写数据、不删文件
#   - Task16DayMvsvFileDataSyncSupabase: FTMM/V5/ (FTMM 12 列格式, 按文件名日期升序)
# 触发方式:
#   - 定时触发: 每 5 小时自动运行一次(UTC 0/5/10/15/20 点的第 17 分, 即北京时间
#     08:17 / 13:17 / 18:17 / 23:17 / 04:17), batchSize/fileLimit 取默认值;
#     删除开关由仓库变量 SUPABASE_SCHEDULED_DELETE 控制
#     (未配置或非 "true" = 安全模式不删; 配置为 "true" = 定时运行也执行删除)
#   - 手动触发: Actions 页 Run workflow, 各输入以页面填写为准
#     (enableDelete 仅作用于本次运行中全部批次成功的文件)
# 注意:
#   - 处理顺序按文件名日期升序, 同日期按证券代码自然排序;
#   - 单次运行最多处理 fileLimit 个文件, 其余留待下次;
#   - 删除目标为本仓库(ACANX/Distribution)的 quote 分支, 依赖 Secret
#     GIT_COMMIT_TOKEN(需本仓库 contents:write 权限);
#   - 依赖 Secrets: SUPABASE_PROJECT_REF / SUPABASE_KEY(Supabase Dashboard > Settings > API);
#   - 依赖 Secrets: URL_QUOTE_SYNC_BASE(自建行情服务基础地址, 如 http://<实例IP>:18001,
#     无鉴权, 服务端按来源 IP 白名单放行); 该 Secret 缺失时 Task16...PG 步骤直接失败;
#   - 步骤顺序为 Task16DayMvsvFileDataSyncPG → Task16DayMvsvFileDataSyncSupabase:
#     镜像写入未完整成功时中断, 避免源文件被 Supabase 步骤删除后镜像永久缺数
#     (Upsert 幂等, 修复后重跑自动补齐); 如确需弱化该保护, 可给 PG 步骤加
#     continue-on-error: true; 若只是个别行/字段不合法导致 partial 阻塞队列,
#     可配仓库变量 PG_SYNC_ALLOW_PARTIAL=true 把 partial 降级为告警(仍退出 0);
#   - 建议首轮 batchSize=50 / fileLimit=5 / enableDelete=false 试运行核对日志,
#     确认入库与"待删除"清单无误后再开删除开关。
name: quote.06DayMvsvFileDataSyncPG

on:
  schedule:
    # 每 5 小时一次: UTC 0/5/10/15/20 点的第 17 分触发
    # (= 北京时间 08:17 / 13:17 / 18:17 / 23:17 / 04:17)
    # 注: 一天 24 小时无法被 5 整除, 20 点 -> 次日 0 点间隔为 4 小时,
    # 属 cron 固有限制; GitHub 定时任务按 UTC 解析, 实际触发可能延迟数分钟
    - cron: "17 */5 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "要处理的分支名"
        required: false
        default: "quote"
      batchSize:
        description: "数据库单批提交行数"
        required: false
        default: "100"
      fileLimit:
        description: "单次运行的文件数上限"
        required: false
        default: "500"
      enableDelete:
        description: "删除开关(仅对本次全部批次成功的文件生效)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  sync-to-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出仓库(指定分支)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # - name: 运行入库脚本
      #   env:
      #     GIT_COMMIT_TOKEN: ${{ secrets.GIT_COMMIT_TOKEN }}
      #     SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      #     SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      #     SUPABASE_BATCH_SIZE: ${{ inputs.batchSize || '50' }}
      #     SUPABASE_FILE_LIMIT: ${{ inputs.fileLimit || '150' }}
      #     # 手动触发取输入值; 定时触发(无 inputs)回落到仓库变量
      #     # SUPABASE_SCHEDULED_DELETE, 未配置时脚本端默认安全模式(不删)
      #     SUPABASE_ENABLE_DELETE: ${{ github.event_name == 'workflow_dispatch' && inputs.enableDelete || vars.SUPABASE_SCHEDULED_DELETE }}
      #     CURR_BRANCH: ${{ inputs.branch || github.ref_name }}
      #     PYTHONIOENCODING: utf-8
      #   shell: bash
      #   run: |
      #     python3 .github/Python/Quote/Task06DayMvsvFileDataSyncSupabase.py

      # 先增量镜像到自建行情服务(PG): 与下面的 Supabase 步骤读取同一批 FTMM/V5
      # 文件、同一 fileLimit; 本步骤不删除源文件, 失败即中断后续步骤(见文件头说明)
      - name: Task16DayMvsvFileDataSyncPG
        env:
          URL_QUOTE_SYNC_BASE: ${{ secrets.URL_QUOTE_SYNC_BASE }}
          # 定时触发无 inputs, 回落到各自默认值(100 / 150)
          PG_SYNC_BATCH_SIZE: ${{ inputs.batchSize || '100' }}
          PG_SYNC_FILE_LIMIT: ${{ inputs.fileLimit || '500' }}
          PG_SYNC_ON_CONFLICT: update
          PG_SYNC_TIMEOUT: "60"
          PG_SYNC_RETRIES: "2"
          # 未配置仓库变量 = 严格模式: 有行/字段被丢弃(partial)也按失败返回
          PG_SYNC_ALLOW_PARTIAL: ${{ vars.PG_SYNC_ALLOW_PARTIAL }}
          CURR_BRANCH: ${{ inputs.branch || github.ref_name }}
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          python3 .github/Python/Quote/Task16DayMvsvFileDataSyncPG.py

      # - name: Task16DayMvsvFileDataSyncSupabase
      #   env:
      #     GIT_COMMIT_TOKEN: ${{ secrets.GIT_COMMIT_TOKEN }}
      #     SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      #     SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      #     SUPABASE_BATCH_SIZE: ${{ inputs.batchSize || '50' }}
      #     SUPABASE_FILE_LIMIT: ${{ inputs.fileLimit || '150' }}
      #     # 手动触发取输入值; 定时触发(无 inputs)回落到仓库变量
      #     # SUPABASE_SCHEDULED_DELETE, 未配置时脚本端默认安全模式(不删)
      #     SUPABASE_ENABLE_DELETE: ${{ github.event_name == 'workflow_dispatch' && inputs.enableDelete || vars.SUPABASE_SCHEDULED_DELETE }}
