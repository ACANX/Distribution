name: quote.01Aggregate
on:
  push:
    branches: [quote]
    paths:
      - 'Data/Finv/SecuQuote/**/*.mvsv'
      - '!Data/Finv/SecuQuote/**/Latest.mvsv'
      - 'Data/Finv/SecurityQuoteV5/FTMM/**/*.mvsv'
      - '!Data/Finv/SecurityQuoteV5/FTMM/**/Latest.mvsv'
  workflow_dispatch:
    inputs:
      codes:
        description: "仅处理指定证券（逗号分隔，留空=全部）"
        required: false
        default: ""
  schedule:
    - cron: "0 2 * * 1,3,5"
concurrency:
  group: quote-all
  cancel-in-progress: false
jobs:
  Aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: quote
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r .github/Python/Quote/requirements.txt
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: RunTask01AggregateLatest
        env:
          QUOTE_CODES: ${{ github.event.inputs.codes }}
        run: python .github/Python/Quote/Task01AggregateLatest.py
      - name: RunTask11AggregateLatest
        env:
          QUOTE_CODES: ${{ github.event.inputs.codes }}
          GITHUB_TOKEN: ${{ secrets.GIT_COMMIT_TOKEN }}
          # 固定目标分支, 与 checkout 的 ref 保持一致
          # 不跟随触发 ref: workflow_dispatch 从 Actions 页面触发时默认是仓库默认分支 dev
          QUOTE_BRANCH: quote
          # 聚合后清理已被 Latest 完整覆盖的原始文件 (与 Task01 的 CleanupRawAfterAggregate 对齐)
          AGG_CLEANUP_RAW: "1"
        run: python .github/Python/Quote/Task11AggregateLatest.py
      - name: VerifyCleanPush
        run: |
          git log origin/quote..HEAD --oneline | (! read)
          git status --short | (! read)
